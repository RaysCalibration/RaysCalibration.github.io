<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rays Website Admin</title><link rel="stylesheet" href="admin.css"><style>.section-nav{display:grid;gap:6px}.section-nav button{background:#29465d;color:#dce7ef}.section-nav button:hover,.section-nav button.active{background:#d86d18;color:#fff}</style></head><body>
<div class="admin-shell"><aside class="sidebar"><div class="brand">Rays Admin<small>Complete website content manager</small></div><nav id="section-nav" class="section-nav"><button class="active" data-mode="products" type="button">Products</button><button data-mode="calibration" type="button">Calibration Services</button><button data-mode="spares" type="button">Spares &amp; Accessories</button><button data-mode="texts" type="button">Website Text &amp; Sections</button></nav><input id="item-search" type="search" placeholder="Search…" aria-label="Search items"><button id="add-item" type="button">+ Add new product</button><div id="item-list" class="product-list" aria-label="Editable items"></div><button id="reset-data" class="secondary" type="button">Restore Version 5 content</button></aside>
